[project]
name = "legallens-orchestrator"
version = "0.1.0"
description = "Standalone LegalLens intent classification module"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legallens_orchestrator"]
